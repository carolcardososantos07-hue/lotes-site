<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotes Chácara das Mansões</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #f7f4ec, #ffffff);
      color: #222;
      text-align: center;
      overflow-x: hidden;
    }

    header {
      padding: 10px 10px 4px;
    }

    .logo {
      font-size: 12px;
      letter-spacing: 4px;
      font-weight: 800;
      color: #244b28;
    }

    h1 {
      margin: 3px 0 0;
      font-size: clamp(22px, 4vw, 34px);
      color: #143c18;
    }

    .subtitulo {
      color: #666;
      margin-top: 2px;
      font-size: 13px;
    }

    .resumo {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: nowrap;
      margin: 8px auto;
      padding: 0 8px;
      max-width: 720px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 7px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      font-weight: bold;
      font-size: 13px;
      flex: 1;
      min-width: 0;
    }

    .legenda {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: nowrap;
      margin: 8px 0;
      font-size: 13px;
    }

    .legenda span {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: bold;
      white-space: nowrap;
    }

    .cor {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      border: 1px solid #777;
    }

    .cor.disponivel { background: #fff; }
    .cor.reservado { background: #ffd966; }
    .cor.vendido { background: #d93025; }

    .area-mapa {
      width: min(96vw, 760px);
      margin: auto;
      padding: 4px 8px 8px;
    }

    .rua {
      margin: 6px auto;
      padding: 6px;
      border-radius: 18px;
      background: #244b28;
      color: #fff;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .mapa {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 7px;
      justify-content: center;
      margin: 8px 0;
    }

    .lote {
      aspect-ratio: 1 / 0.78;
      border-radius: 8px;
      border: 1.5px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(13px, 2vw, 18px);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,.15);
      transition: .2s;
      min-height: 42px;
    }

    .lote:hover {
      transform: scale(1.04);
    }

    .disponivel {
      background: #ffffff;
      color: #111;
    }

    .reservado {
      background: #ffd966;
      color: #111;
    }

    .vendido {
      background: #d93025;
      color: #fff;
    }

    .info {
      min-height: 28px;
      margin-top: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    footer {
      font-size: 11px;
      color: #777;
      padding-bottom: 6px;
    }

  @media (max-width: 600px) {
  body {
    overflow-x: hidden;
  }

  header {
    padding: 8px 6px 2px;
  }

  .logo {
    font-size: 10px;
    letter-spacing: 3px;
  }

  h1 {
    font-size: 22px;
    line-height: 1.1;
  }

  .subtitulo {
    display: none;
  }

  .resumo {
    gap: 4px;
    margin: 6px auto;
    padding: 0 4px;
  }

  .card {
    font-size: 10px;
    padding: 6px 3px;
    border-radius: 8px;
  }

  .legenda {
    gap: 6px;
    font-size: 10px;
    margin: 6px 0;
  }

  .cor {
    width: 11px;
    height: 11px;
  }

  .area-mapa {
    width: 100vw;
    padding: 2px 4px 4px;
  }

  .rua {
    margin: 4px auto;
    padding: 4px;
    font-size: 9px;
    letter-spacing: 2px;
    border-radius: 12px;
  }
    
    .mapa {
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
  margin: 6px 0;
 }

  .lote {
    min-height: 30px;
    aspect-ratio: 1 / 0.85;
    border-radius: 5px;
    border: 1px solid #333;
    font-size: 11px;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }

  .lote:hover {
    transform: none;
  }

  .info {
    min-height: 22px;
    margin-top: 4px;
    font-size: 11px;
    padding: 0 6px;
  }

  footer {
    display: none;
  }
}

    @media (max-height: 720px) and (min-width: 700px) {
      .subtitulo, footer {
        display: none;
      }

      .lote {
        min-height: 38px;
      }

      .mapa {
        gap: 5px;
      }

      .card {
        padding: 5px 8px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">LOTES</div>
    <h1>Chácara das Mansões</h1>
    <div class="subtitulo">Controle de disponibilidade em tempo real</div>
  </header>

  <section class="resumo">
    <div class="card">Disponíveis: <span id="qtdDisponivel">0</span></div>
    <div class="card">Reservados: <span id="qtdReservado">0</span></div>
    <div class="card">Vendidos: <span id="qtdVendido">0</span></div>
  </section>

  <section class="legenda">
    <span><div class="cor disponivel"></div> Disponível</span>
    <span><div class="cor reservado"></div> Reservado</span>
    <span><div class="cor vendido"></div> Vendido</span>
  </section>

  <main class="area-mapa">
    <div class="rua">Rua Arcádia</div>
    <div id="mapa" class="mapa"></div>
    <div class="rua">Área interna do condomínio</div>
    <div id="info" class="info">Clique em um lote para ver mais informações.</div>
  </main>

  <footer>
    Atualizado automaticamente pela planilha Google Sheets
  </footer>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgfBPxf18hlR11ou3PgRHmFryyIqpzBC47paSjzktM3nwf5ZL92NhJ5pkdZ3smXarjU6AfPFR0ZKrf/pub?gid=0&single=true&output=csv";

    async function carregarLotes() {
      const resposta = await fetch(CSV_URL);
      const texto = await resposta.text();

      const linhas = texto.trim().split("\n");
      const cabecalho = linhas[0].split(",").map(c => c.trim().toLowerCase());

      const lotes = linhas.slice(1).map(linha => {
        const colunas = linha.split(",");
        let item = {};

        cabecalho.forEach((nome, index) => {
          item[nome] = colunas[index]?.trim() || "";
        });

        return item;
      });

      desenharMapa(lotes);
      atualizarResumo(lotes);
    }

    function desenharMapa(lotes) {
      const mapa = document.getElementById("mapa");
      mapa.innerHTML = "";

      lotes.forEach(lote => {
        const div = document.createElement("div");
        const status = normalizarStatus(lote.status);

        div.className = `lote ${status}`;
        div.innerText = lote.lote;

        div.onclick = () => {
          document.getElementById("info").innerText =
            `Lote ${lote.lote} - ${status.toUpperCase()}${lote.cliente ? " - Cliente: " + lote.cliente : ""}`;
        };

        mapa.appendChild(div);
      });
    }

    function atualizarResumo(lotes) {
      document.getElementById("qtdDisponivel").innerText =
        lotes.filter(l => normalizarStatus(l.status) === "disponivel").length;

      document.getElementById("qtdReservado").innerText =
        lotes.filter(l => normalizarStatus(l.status) === "reservado").length;

      document.getElementById("qtdVendido").innerText =
        lotes.filter(l => normalizarStatus(l.status) === "vendido").length;
    }

    function normalizarStatus(status) {
      status = (status || "disponivel").toLowerCase().trim();

      if (status.includes("vend")) return "vendido";
      if (status.includes("reserv")) return "reservado";

      return "disponivel";
    }

    carregarLotes();
  </script>

</body>
</html>
