<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lotes Chácara das Mansões</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f4ec;
  text-align: center;
  color: #222;
}

header {
  padding: 10px 8px 4px;
}

.logo {
  font-size: 12px;
  letter-spacing: 4px;
  font-weight: 800;
  color: #244b28;
}

h1 {
  margin: 3px 0;
  font-size: clamp(22px, 4vw, 34px);
  color: #143c18;
}

.resumo {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 8px auto;
  max-width: 720px;
  padding: 0 8px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 7px 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  font-weight: bold;
  font-size: 13px;
  flex: 1;
}

.legenda {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin: 8px 0;
  font-size: 13px;
  font-weight: bold;
}

.legenda span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.cor {
  width: 15px;
  height: 15px;
  border: 1px solid #777;
  border-radius: 4px;
}

.cor.disponivel {
  background: #fff;
}

.cor.reservado {
  background: #ffd966;
}

.cor.vendido {
  background: #d93025;
}

.area-mapa {
  width: min(96vw, 1050px);
  margin: auto;
  padding: 6px;
}

.rua-topo {
  background: #244b28;
  color: white;
  padding: 7px;
  border-radius: 18px;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.mapa-loteamento {
  display: grid;
  grid-template-columns: 1fr 42px 1fr 1fr 42px 1fr;
  gap: 6px;
  align-items: stretch;
}

.coluna-externa {
  display: grid;
  grid-template-rows: repeat(13, 1fr);
  gap: 4px;
  min-height: 560px;
}

.coluna-meio {
  display: grid;
  grid-template-rows: repeat(14, 1fr);
  gap: 4px;
  min-height: 520px;
}

.bloco-meio {
  display: flex;
  flex-direction: column;
}

.lote {
  border-radius: 6px;
  border: 1.4px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,.15);
  min-height: 36px;
}

.rua-vertical {
  background: #e8e3d6;
  border-left: 2px solid #b9b09c;
  border-right: 2px solid #b9b09c;
  border-radius: 14px;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 3px;
  color: #555;
  text-transform: uppercase;
  min-height: 560px;
}

.disponivel {
  background: #fff;
  color: #111;
}

.reservado {
  background: #ffd966;
  color: #111;
}

.vendido {
  background: #d93025;
  color: #fff;
}

.info {
  margin-top: 10px;
  font-size: 14px;
  font-weight: bold;
  min-height: 24px;
}

footer {
  font-size: 11px;
  color: #777;
  padding: 6px;
}

@media (max-width: 600px) {

  .resumo {
    gap: 4px;
    padding: 0 4px;
  }

  .card {
    font-size: 10px;
    padding: 6px 3px;
  }

  .legenda {
    font-size: 10px;
    gap: 7px;
  }

  .area-mapa {
    width: 100vw;
    padding: 4px;
  }

  .mapa-loteamento {
    grid-template-columns: 1fr 20px 1fr 1fr 20px 1fr;
    gap: 3px;
  }

  .coluna-externa {
    min-height: 430px;
    gap: 3px;
  }

  .coluna-meio {
    min-height: 400px;
    gap: 3px;
  }

  .lote {
    font-size: 10px;
    min-height: 28px;
    border-radius: 4px;
  }

  .rua-vertical {
    min-height: 430px;
    font-size: 8px;
    letter-spacing: 1px;
    border-radius: 8px;
  }

  .rua-topo {
    font-size: 10px;
    padding: 5px;
  }

  footer {
    display: none;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">LOTES</div>
  <h1>Chácara das Mansões</h1>
</header>

<section class="resumo">
  <div class="card">
    Disponíveis:
    <span id="qtdDisponivel">0</span>
  </div>

  <div class="card">
    Reservados:
    <span id="qtdReservado">0</span>
  </div>

  <div class="card">
    Vendidos:
    <span id="qtdVendido">0</span>
  </div>
</section>

<section class="legenda">
  <span>
    <div class="cor disponivel"></div>
    Disponível
  </span>

  <span>
    <div class="cor reservado"></div>
    Reservado
  </span>

  <span>
    <div class="cor vendido"></div>
    Vendido
  </span>
</section>

<main class="area-mapa">

  <div class="rua-topo">
    Rua Arcádia
  </div>

  <div class="mapa-loteamento">

    <div id="grupo1" class="coluna-externa"></div>

    <div class="rua-vertical">
      Rua Interna
    </div>

    <div class="bloco-meio">
      <div id="grupo2" class="coluna-meio"></div>
    </div>

    <div class="bloco-meio">
      <div id="grupo3" class="coluna-meio"></div>
    </div>

    <div class="rua-vertical">
      Rua Interna
    </div>

    <div id="grupo4" class="coluna-externa"></div>

  </div>

  <div id="info" class="info">
    Clique em um lote para ver mais informações.
  </div>

</main>

<footer>
  Atualizado automaticamente pela planilha Google Sheets
</footer>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQgfBPxf18hlR11ou3PgRHmFryyIqpzBC47paSjzktM3nwf5ZL92NhJ5pkdZ3smXarjU6AfPFR0ZKrf/pub?gid=0&single=true&output=csv";

async function carregarLotes() {

  const resposta = await fetch(CSV_URL);
  const texto = await resposta.text();

  const linhas = texto.trim().split("\n");

  const cabecalho = linhas[0]
    .split(",")
    .map(c => c.trim().toLowerCase());

  const lotes = linhas.slice(1).map(linha => {

    const colunas = linha.split(",");

    let item = {};

    cabecalho.forEach((nome, index) => {
      item[nome] = colunas[index]?.trim() || "";
    });

    return item;
  });

  desenharMapa(lotes);
  atualizarResumo(lotes);
}

function desenharMapa(lotes) {

  const grupos = {

    grupo1: lotes.filter(
      l => numeroLote(l.lote) >= 1 &&
      numeroLote(l.lote) <= 13
    ),

    grupo2: lotes.filter(
      l => numeroLote(l.lote) >= 14 &&
      numeroLote(l.lote) <= 27
    ),

    grupo3: lotes
  .filter(
    l => numeroLote(l.lote) >= 28 &&
    numeroLote(l.lote) <= 41
  )
  .sort((a, b) => numeroLote(b.lote) - numeroLote(a.lote)),

    grupo4: lotes.filter(
      l => numeroLote(l.lote) >= 42 &&
      numeroLote(l.lote) <= 54
    )
  };

  Object.keys(grupos).forEach(id => {

    const coluna = document.getElementById(id);

    coluna.innerHTML = "";

    grupos[id].forEach(lote => {

      const div = document.createElement("div");

      const status = normalizarStatus(lote.status);

      div.className = `lote ${status}`;

      div.innerText = lote.lote;

      div.onclick = () => {

        document.getElementById("info").innerText =
          `Lote ${lote.lote} - ${status.toUpperCase()}${
            lote.cliente
            ? " - Cliente: " + lote.cliente
            : ""
          }`;
      };

      coluna.appendChild(div);

    });

  });

}

function atualizarResumo(lotes) {

  document.getElementById("qtdDisponivel").innerText =
    lotes.filter(
      l => normalizarStatus(l.status) === "disponivel"
    ).length;

  document.getElementById("qtdReservado").innerText =
    lotes.filter(
      l => normalizarStatus(l.status) === "reservado"
    ).length;

  document.getElementById("qtdVendido").innerText =
    lotes.filter(
      l => normalizarStatus(l.status) === "vendido"
    ).length;
}

function normalizarStatus(status) {

  status = (status || "disponivel")
    .toLowerCase()
    .trim();

  if (status.includes("vend")) return "vendido";

  if (status.includes("reserv")) return "reservado";

  return "disponivel";
}

function numeroLote(lote) {
  return parseInt(
    String(lote).replace(/\D/g, ""),
    10
  );
}

carregarLotes();

</script>

</body>
</html>
```
